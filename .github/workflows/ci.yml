name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: ci-password
      DB_USER: ci-user
      DB_NAME: ci-database
      DB_HOST: localhost
      REDIS_URL: https://example.com
      REDIS_TOKEN: ci-token
      OAUTH_REDIRECT_URL_BASE: http://localhost:3000/api/oauth/
      DISCORD_CLIENT_ID: ci-discord-client
      DISCORD_CLIENT_SECRET: ci-discord-secret
      GITHUB_CLIENT_ID: ci-github-client
      GITHUB_CLIENT_SECRET: ci-github-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
