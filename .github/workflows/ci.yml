name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_USER: ci-user
          POSTGRES_DB: ci-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci-user -d ci-database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ci-password
      DB_USER: ci-user
      DB_NAME: ci-database
      DB_HOST: localhost
      REDIS_URL: https://example.com
      REDIS_TOKEN: ci-token
      OAUTH_REDIRECT_URL_BASE: http://localhost:3000/api/oauth/
      DISCORD_CLIENT_ID: ci-discord-client
      DISCORD_CLIENT_SECRET: ci-discord-secret
      GITHUB_CLIENT_ID: ci-github-client
      GITHUB_CLIENT_SECRET: ci-github-secret
      RUN_DB_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
